<label class="flex flex-col gap-1 col-span-2">
  <span class="text-xs font-bold uppercase tracking-wider opacity-50">Nickname</span>
  <input type="text" name="nickname" maxlength="60" value="{{ s.nickname|default:'' }}" placeholder="e.g. Regalia, Salary account" class="input input-bordered input-sm w-full">
</label>
<label class="flex flex-col gap-1">
  <span class="text-xs font-bold uppercase tracking-wider opacity-50">Type</span>
  <select name="kind" class="select select-bordered select-sm w-full">
    {% for value, label in kind_choices %}<option value="{{ value }}" {% if s.kind == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</label>
<label class="flex flex-col gap-1">
  <span class="text-xs font-bold uppercase tracking-wider opacity-50">Bank / issuer</span>
  <input type="text" name="institution" maxlength="40" value="{{ s.institution|default:'' }}" placeholder="HDFC" class="input input-bordered input-sm w-full">
</label>
<label class="flex flex-col gap-1">
  <span class="text-xs font-bold uppercase tracking-wider opacity-50">Last 4 digits</span>
  <input type="text" name="last4" inputmode="numeric" maxlength="4" pattern="\d{4}" value="{{ s.last4|default:'' }}" class="input input-bordered input-sm w-full">
</label>
<label class="flex flex-col gap-1">
  <span class="text-xs font-bold uppercase tracking-wider opacity-50">Owner</span>
  <select name="owner" class="select select-bordered select-sm w-full">
    <option value="">Shared</option>
    {% for m in members %}<option value="{{ m.pk }}" {% if s.owner_id == m.pk %}selected{% endif %}>{{ m.first_name|default:m.username }}</option>{% endfor %}
  </select>
</label>
<label class="flex flex-col gap-1 col-span-2">
  <span class="text-xs font-bold uppercase tracking-wider opacity-50">Statement PDF password</span>
  <input type="password" name="statement_password" autocomplete="new-password" maxlength="64"
         placeholder="{% if s.statement_password_enc %}Saved — leave blank to keep{% else %}e.g. ATUL0101 or last 4 digits{% endif %}" class="input input-bordered input-sm w-full">
  <span class="text-[11px] opacity-45">Stored encrypted. Usually first 4 letters of your name + DDMM of birth, or card digits — check the bank's statement email.</span>
</label>
{% if s.statement_password_enc %}
<label class="flex items-center gap-2 col-span-2 cursor-pointer">
  <input type="checkbox" name="clear_password" class="checkbox checkbox-xs"><span class="text-xs opacity-70">Forget saved password</span>
</label>
{% endif %}
