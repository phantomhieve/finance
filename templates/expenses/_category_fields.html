<div class="sm:col-span-2 p-3 rounded-xl bg-base-200/60 border border-[var(--v-hairline)] flex items-center gap-3.5">
  <span class="jw-type-avatar shrink-0 cat-live-avatar" style="--h:{% if c %}{{ c.hue }}{% else %}230{% endif %};width:2.5rem;height:2.5rem;border-radius:.75rem">
    <span class="icon-filled material-symbols-outlined text-xl cat-live-icon">{{ c.icon|default:'category' }}</span>
  </span>
  <div class="min-w-0 flex-1">
    <div class="text-sm font-bold truncate text-base-content cat-live-name">{{ c.name|default:'New Category' }}</div>
    <div class="text-xs text-base-content/50">Live category badge preview</div>
  </div>
  <span class="badge badge-xs badge-ghost font-mono tabular-nums opacity-65 cat-live-hue-lbl">H:{{ c.hue|default:230 }}°</span>
</div>

<label class="flex flex-col gap-1 sm:col-span-2">
  <span class="text-xs font-semibold text-base-content/75">Category Name</span>
  <input type="text" name="name" required maxlength="50" value="{{ c.name|default:'' }}" placeholder="e.g. Coffee &amp; Cafes"
         class="v-input input input-bordered w-full min-h-11 lg:min-h-9 bg-base-100 rounded-lg text-base sm:text-sm"
         oninput="syncCatPreview(this)">
</label>

<label class="flex flex-col gap-1">
  <span class="text-xs font-semibold text-base-content/75">Classification</span>
  <select name="kind" class="v-input select select-bordered w-full min-h-11 lg:min-h-9 bg-base-100 rounded-lg text-base sm:text-xs">
    {% for value, label in category_kinds %}<option value="{{ value }}" {% if c.kind == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</label>

<label class="flex flex-col gap-1">
  <span class="text-xs font-semibold text-base-content/75">Color Accent (0° – 360°)</span>
  <div class="min-h-11 lg:min-h-9 flex items-center">
    <input type="range" name="hue" min="0" max="360" value="{% if c %}{{ c.hue }}{% else %}230{% endif %}"
           class="range range-xs range-primary w-full !min-h-11 lg:!min-h-6 cursor-pointer"
           oninput="syncCatPreview(this)">
  </div>
</label>

<div class="flex flex-col gap-1.5 sm:col-span-2">
  <label class="flex flex-col gap-1">
    <span class="text-xs font-semibold text-base-content/75">Symbol Icon (Material Symbol)</span>
    <input type="text" name="icon" maxlength="40" value="{{ c.icon|default:'category' }}" placeholder="e.g. local_cafe"
           class="v-input input input-bordered w-full min-h-11 lg:min-h-9 bg-base-100 font-mono text-base sm:text-xs rounded-lg"
           oninput="syncCatPreview(this)">
  </label>
  <div class="flex flex-wrap gap-1.5 pt-1" role="group" aria-label="Preset category icons">
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'restaurant')" title="restaurant" aria-label="Select restaurant icon"><span class="material-symbols-outlined text-base">restaurant</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'local_grocery_store')" title="local_grocery_store" aria-label="Select grocery icon"><span class="material-symbols-outlined text-base">local_grocery_store</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'shopping_bag')" title="shopping_bag" aria-label="Select shopping bag icon"><span class="material-symbols-outlined text-base">shopping_bag</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'local_cafe')" title="local_cafe" aria-label="Select cafe icon"><span class="material-symbols-outlined text-base">local_cafe</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'flight')" title="flight" aria-label="Select flight icon"><span class="material-symbols-outlined text-base">flight</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'directions_car')" title="directions_car" aria-label="Select car icon"><span class="material-symbols-outlined text-base">directions_car</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'medical_services')" title="medical_services" aria-label="Select medical icon"><span class="material-symbols-outlined text-base">medical_services</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'subscriptions')" title="subscriptions" aria-label="Select subscriptions icon"><span class="material-symbols-outlined text-base">subscriptions</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'home')" title="home" aria-label="Select home icon"><span class="material-symbols-outlined text-base">home</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'bolt')" title="bolt" aria-label="Select utilities icon"><span class="material-symbols-outlined text-base">bolt</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'redeem')" title="redeem" aria-label="Select gift icon"><span class="material-symbols-outlined text-base">redeem</span></button>
    <button type="button" class="v-icon-btn btn btn-ghost btn-square !min-h-11 !min-w-11 lg:!min-h-9 lg:!min-w-9 rounded-lg border border-[var(--v-hairline)] hover:border-primary/40 cursor-pointer" onclick="pickCatIcon(this, 'payments')" title="payments" aria-label="Select payments icon"><span class="material-symbols-outlined text-base">payments</span></button>
  </div>
</div>
