<dialog class="modal modal-bottom sm:modal-middle" id="{{ modal_id }}">
  <div class="modal-box max-w-lg max-h-[90dvh] overflow-y-auto overscroll-contain">
    <div class="v-modal-header flex items-center justify-between gap-3 pb-3 mb-4 border-b border-[var(--v-hairline)]">
      <h3 class="font-semibold text-base text-base-content flex items-center gap-2" id="{{ title_id }}">
        <span class="material-symbols-outlined text-amber-400 text-xl">diamond</span>Add Commodity
      </h3>
      <button type="button" class="v-icon-btn" onclick="closeModal('{{ modal_id }}')" aria-label="Close">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
    <form id="{{ form_id }}" method="post" action="{% url 'add_commodity' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      {% if is_baby %}
        <input type="hidden" name="is_baby" value="True">
      {% endif %}
      <div class="v-form-grid">
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Metal Type</span>
            {{ form_obj.commodity_type }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Purity</span>
            {{ form_obj.purity }}
          </label>
        </div>
        <label class="form-field v-field">
          <span class="v-label">Description / Item Name</span>
          {{ form_obj.description }}
        </label>
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Weight (grams)</span>
            {{ form_obj.weight_grams }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Purchase Price / gram (₹)</span>
            {{ form_obj.purchase_price_per_gram }}
          </label>
        </div>
      </div>
      <div class="v-modal-footer modal-action flex-wrap items-center gap-2 mt-6 pt-3 border-t border-[var(--v-hairline)]">
        <button type="button" id="{{ delete_btn_id }}" class="v-btn v-btn-danger mr-auto" style="display:none" onclick="confirmDelete('{{ delete_form_id }}')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="v-btn v-btn-ghost" onclick="closeModal('{{ modal_id }}')">Cancel</button>
        <button type="submit" class="v-btn v-btn-primary">
          <span class="material-symbols-outlined text-base">save</span>Save Bullion
        </button>
      </div>
    </form>
    <form id="{{ delete_form_id }}" method="post" action="" style="display:none">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close modal">close</button></form>
</dialog>
