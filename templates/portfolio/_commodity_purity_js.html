<script>
(function() {
  var goldOpts = [
    {v:'24k', t:'24k (999)'},
    {v:'22k', t:'22k (916)'},
    {v:'18k', t:'18k (750)'},
    {v:'14k', t:'14k (585)'}
  ];
  var silverOpts = [
    {v:'999', t:'999 (Fine Silver)'},
    {v:'925', t:'925 (Sterling)'},
    {v:'900', t:'900'},
    {v:'800', t:'800'}
  ];

  function updatePurityOptions(typeSelect, puritySelect, keepValue) {
    if (!typeSelect || !puritySelect) return;
    var opts = typeSelect.value === 'SILVER' ? silverOpts : goldOpts;
    var prev = keepValue || puritySelect.value;
    puritySelect.innerHTML = '';
    opts.forEach(function(o) {
      var opt = document.createElement('option');
      opt.value = o.v;
      opt.textContent = o.t;
      puritySelect.appendChild(opt);
    });
    var found = opts.some(function(o) { return o.v === prev; });
    puritySelect.value = found ? prev : opts[0].v;

    // Default the purchase price to today's price if we are in Add mode
    var form = typeSelect.closest('form');
    if (form) {
      var deleteBtn = form.querySelector('[id*="DeleteBtn"]') || form.querySelector('[id*="deleteBtn"]');
      var isAddMode = !deleteBtn || deleteBtn.style.display === 'none';
      if (isAddMode) {
        var purchaseInput = form.querySelector('[name=purchase_price_per_gram]');
        if (purchaseInput) {
          if (typeSelect.value === 'SILVER') {
            purchaseInput.value = window.SILVER_RATE || '';
          } else {
            purchaseInput.value = window.GOLD_RATE || '';
          }
        }
      }
    }
  }

  function init() {
    document.querySelectorAll('[name=commodity_type]').forEach(function(typeEl) {
      var form = typeEl.closest('form');
      if (!form) return;
      var purityEl = form.querySelector('[name=purity]');
      if (!purityEl) return;
      
      typeEl.addEventListener('change', function() {
        updatePurityOptions(typeEl, purityEl);
      });
      // Initialize
      updatePurityOptions(typeEl, purityEl);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window._updateCommodityPurity = updatePurityOptions;
})();
</script>
