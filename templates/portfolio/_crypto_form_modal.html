<dialog class="modal modal-bottom sm:modal-middle" id="addCryptoModal">
  <div class="modal-box max-w-md max-h-[90dvh] overflow-y-auto overscroll-contain">
    <div class="v-modal-header flex items-center justify-between gap-3 pb-3 mb-4 border-b border-[var(--v-hairline)]">
      <h3 id="cryptoModalTitle" class="font-semibold text-base text-base-content flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-xl">currency_bitcoin</span> Add Crypto Holding
      </h3>
      <button type="button" class="v-icon-btn" onclick="closeModal('addCryptoModal')" aria-label="Close">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
    <form id="cryptoForm" method="post" action="{% url 'add_crypto' %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      {% if is_baby %}<input type="hidden" name="is_baby" value="True">{% endif %}
      <div class="v-form-grid">
        <label class="form-field v-field">
          <span class="v-label">Asset / Exchange Name</span>
          {{ form_obj.name }}
        </label>
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Invested (₹)</span>
            {{ form_obj.amount_invested }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Current Value (₹)</span>
            {{ form_obj.current_value }}
          </label>
        </div>
        <label class="form-field v-field">
          <span class="v-label">Remarks <span class="text-base-content/40 font-normal normal-case tracking-normal">optional</span></span>
          {{ form_obj.remarks }}
        </label>
      </div>
      <div class="v-modal-footer modal-action flex-wrap items-center gap-2 mt-6 pt-3 border-t border-[var(--v-hairline)]">
        <button type="button" id="cryptoDeleteBtn" class="v-btn v-btn-danger mr-auto hidden" onclick="confirmDelete('deleteCryptoForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="v-btn v-btn-ghost" onclick="closeModal('addCryptoModal')">Cancel</button>
        <button type="submit" class="v-btn v-btn-primary">
          <span class="material-symbols-outlined text-base">save</span>Save Holding
        </button>
      </div>
    </form>
    <form id="deleteCryptoForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close modal">close</button></form>
</dialog>
