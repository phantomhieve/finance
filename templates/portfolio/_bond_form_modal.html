<dialog class="modal" id="addBondModal">
  <div class="modal-box max-w-lg">
    <div class="flex items-start justify-between gap-2 mb-4">
      <h3 id="bondModalTitle" class="font-bold text-lg flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">add_circle</span> Add Bond Holding
      </h3>
      <button type="button" class="btn btn-ghost btn-xs btn-square" onclick="closeModal('addBondModal')" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="bondForm" method="post" action="{% url 'add_bond' %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <div class="space-y-3">
        <div class="form-field">
          <label class="label text-xs font-semibold">Account Name</label>
          {{ form_obj.account_name }}
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Amount (₹)</label>
          {{ form_obj.amount }}
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Remarks <span class="opacity-40 font-normal">optional</span></label>
          {{ form_obj.remarks }}
        </div>
      </div>
      <div class="modal-action flex-wrap gap-2 mt-6">
        <button type="button" id="bondDeleteBtn" class="btn btn-error btn-sm gap-1 mr-auto hidden" onclick="confirmDelete('deleteBondForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('addBondModal')">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm gap-1">
          <span class="material-symbols-outlined text-base">save</span>Save
        </button>
      </div>
    </form>
    <form id="deleteBondForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
