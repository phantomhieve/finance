<dialog class="modal modal-bottom sm:modal-middle" id="addNpsModal">
  <div class="modal-box max-w-md max-h-[90dvh] overflow-y-auto overscroll-contain">
    <div class="v-modal-header flex items-center justify-between gap-3 pb-3 mb-4 border-b border-[var(--v-hairline)]">
      <h3 id="npsModalTitle" class="font-semibold text-base text-base-content flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-xl">assured_workload</span> Add NPS Entry
      </h3>
      <button type="button" class="v-icon-btn" onclick="closeModal('addNpsModal')" aria-label="Close">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
    <form id="npsForm" method="post" action="{% url 'add_nps_entry' %}" data-add-url="{% url 'add_nps_entry' %}" data-edit-url="{% url 'edit_nps_entry' pk=0 %}" data-delete-url="{% url 'delete_nps_entry' pk=0 %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <input type="hidden" id="npsPrevBalance" value="{{ nps_latest.total_balance|default_if_none:0|default:0 }}" data-current-balance="{{ nps_latest.total_balance|default_if_none:0|default:0 }}">
      <div class="v-form-grid">
        <label class="form-field v-field">
          <span class="v-label">Statement Date</span>
          {{ form_obj.date }}
        </label>
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Contribution (₹)</span>
            {{ form_obj.contribution }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Market Returns (₹)</span>
            {{ form_obj.interest_earned }}
          </label>
        </div>
        <label class="form-field v-field">
          <span class="v-label">Resulting Corpus Balance (₹) <span class="text-base-content/40 font-normal normal-case tracking-normal">computed</span></span>
          {{ form_obj.total_balance }}
        </label>
        <label class="form-field v-field">
          <span class="v-label">Remarks <span class="text-base-content/40 font-normal normal-case tracking-normal">optional</span></span>
          {{ form_obj.remarks }}
        </label>
      </div>
      <div class="v-modal-footer modal-action flex-wrap items-center gap-2 mt-6 pt-3 border-t border-[var(--v-hairline)]">
        <button type="button" id="npsDeleteBtn" class="v-btn v-btn-danger mr-auto hidden" onclick="confirmDelete('deleteNpsForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="v-btn v-btn-ghost" onclick="closeModal('addNpsModal')">Cancel</button>
        <button type="submit" class="v-btn v-btn-primary">
          <span class="material-symbols-outlined text-base">save</span>Save Entry
        </button>
      </div>
    </form>
    <form id="deleteNpsForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close modal">close</button></form>
</dialog>
