<dialog class="modal modal-bottom sm:modal-middle" id="addNpsModal">
  <div class="modal-box max-w-lg max-h-[90vh] overflow-y-auto overscroll-contain">
    <div class="flex items-start justify-between gap-2 mb-4">
      <h3 id="npsModalTitle" class="font-bold text-lg flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">add_circle</span> Add NPS Entry
      </h3>
      <button type="button" class="btn btn-ghost btn-xs btn-square" onclick="closeModal('addNpsModal')" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="npsForm" method="post" action="{% url 'add_nps_entry' %}" data-add-url="{% url 'add_nps_entry' %}" data-edit-url="{% url 'edit_nps_entry' pk=0 %}" data-delete-url="{% url 'delete_nps_entry' pk=0 %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <input type="hidden" id="npsPrevBalance" value="{{ nps_latest.total_balance|default_if_none:0|default:0 }}" data-current-balance="{{ nps_latest.total_balance|default_if_none:0|default:0 }}">
      <div class="space-y-3">
        <div class="form-field">
          <label class="label text-xs font-semibold">Date</label>
          {{ form_obj.date }}
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="form-field">
            <label class="label text-xs font-semibold">Contribution (₹)</label>
            {{ form_obj.contribution }}
          </div>
          <div class="form-field">
            <label class="label text-xs font-semibold">Returns (₹)</label>
            {{ form_obj.interest_earned }}
          </div>
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Total Balance (₹) <span class="opacity-40 font-normal">auto</span></label>
          {{ form_obj.total_balance }}
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Remarks <span class="opacity-40 font-normal">optional</span></label>
          {{ form_obj.remarks }}
        </div>
      </div>
      <div class="modal-action flex-wrap gap-2 mt-6">
        <button type="button" id="npsDeleteBtn" class="btn btn-error btn-sm gap-1 mr-auto hidden" onclick="confirmDelete('deleteNpsForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('addNpsModal')">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm gap-1">
          <span class="material-symbols-outlined text-base">save</span>Save
        </button>
      </div>
    </form>
    <form id="deleteNpsForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
