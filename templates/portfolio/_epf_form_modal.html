<dialog class="modal modal-bottom sm:modal-middle" id="addEpfModal">
  <div class="modal-box max-w-md max-h-[90dvh] overflow-y-auto overscroll-contain">
    <div class="v-modal-header flex items-center justify-between gap-3 pb-3 mb-4 border-b border-[var(--v-hairline)]">
      <h3 id="epfModalTitle" class="font-semibold text-base text-base-content flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-xl">account_balance</span> Add EPF Entry
      </h3>
      <button type="button" class="v-icon-btn" onclick="closeModal('addEpfModal')" aria-label="Close">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
    <form id="epfForm" method="post" action="{% url 'add_epf_entry' %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <div class="v-form-grid">
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Entry Date</span>
            {{ form_obj.date }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Entry Type</span>
            {{ form_obj.entry_type }}
          </label>
        </div>
        <label class="form-field v-field">
          <span class="v-label">Amount (₹)</span>
          {{ form_obj.amount }}
        </label>
        <label class="form-field v-field">
          <span class="v-label">Remarks <span class="text-base-content/40 font-normal normal-case tracking-normal">optional</span></span>
          {{ form_obj.remarks }}
        </label>
      </div>
      <div class="v-modal-footer modal-action flex-wrap items-center gap-2 mt-6 pt-3 border-t border-[var(--v-hairline)]">
        <button type="button" id="epfDeleteBtn" class="v-btn v-btn-danger mr-auto hidden" onclick="confirmDelete('deleteEpfForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="v-btn v-btn-ghost" onclick="closeModal('addEpfModal')">Cancel</button>
        <button type="submit" class="v-btn v-btn-primary">
          <span class="material-symbols-outlined text-base">save</span>Save Entry
        </button>
      </div>
    </form>
    <form id="deleteEpfForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close modal">close</button></form>
</dialog>
