<dialog class="modal modal-bottom sm:modal-middle" id="addEpfModal">
  <div class="modal-box max-w-lg max-h-[90vh] overflow-y-auto overscroll-contain">
    <div class="flex items-start justify-between gap-2 mb-4">
      <h3 id="epfModalTitle" class="font-bold text-lg flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">add_circle</span> Add EPF Entry
      </h3>
      <button type="button" class="btn btn-ghost btn-xs btn-square" onclick="closeModal('addEpfModal')" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="epfForm" method="post" action="{% url 'add_epf_entry' %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-4">
          <div class="form-field">
            <label class="label text-xs font-semibold">Date</label>
            {{ form_obj.date }}
          </div>
          <div class="form-field">
            <label class="label text-xs font-semibold">Type</label>
            {{ form_obj.entry_type }}
          </div>
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Amount (₹)</label>
          {{ form_obj.amount }}
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Remarks <span class="opacity-40 font-normal">optional</span></label>
          {{ form_obj.remarks }}
        </div>
      </div>
      <div class="modal-action flex-wrap gap-2 mt-6">
        <button type="button" id="epfDeleteBtn" class="btn btn-error btn-sm gap-1 mr-auto hidden" onclick="confirmDelete('deleteEpfForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('addEpfModal')">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm gap-1">
          <span class="material-symbols-outlined text-base">save</span>Save
        </button>
      </div>
    </form>
    <form id="deleteEpfForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
