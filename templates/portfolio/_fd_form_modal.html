<dialog class="modal" id="addFdModal">
  <div class="modal-box max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="flex items-start justify-between gap-2 mb-4">
      <h3 id="fdModalTitle" class="font-bold text-lg flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">add_circle</span> Add Fixed Deposit
      </h3>
      <button type="button" class="btn btn-ghost btn-xs btn-square" onclick="closeModal('addFdModal')" aria-label="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="fdForm" method="post" action="{% url 'add_fd' %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-4">
          <div class="form-field">
            <label class="label text-xs font-semibold">Name</label>
            {{ form_obj.name }}
          </div>
          <div class="form-field">
            <label class="label text-xs font-semibold">Account</label>
            {{ form_obj.account_name }}
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="form-field">
            <label class="label text-xs font-semibold">Principal (₹)</label>
            {{ form_obj.principal }}
          </div>
          <div class="form-field">
            <label class="label text-xs font-semibold">Interest Rate (%)</label>
            {{ form_obj.interest_rate }}
          </div>
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Compounding</label>
          {{ form_obj.compounding }}
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="form-field">
            <label class="label text-xs font-semibold">Start Date</label>
            {{ form_obj.start_date }}
          </div>
          <div class="form-field">
            <label class="label text-xs font-semibold">Maturity Date</label>
            {{ form_obj.maturity_date }}
          </div>
        </div>
        <div class="form-field flex flex-row items-center gap-3">
          {{ form_obj.is_active }}
          <label class="label text-xs font-semibold cursor-pointer" for="{{ form_obj.is_active.id_for_label }}">Active</label>
        </div>
        <div class="form-field">
          <label class="label text-xs font-semibold">Remarks <span class="opacity-40 font-normal">optional</span></label>
          {{ form_obj.remarks }}
        </div>
      </div>
      <div class="modal-action flex-wrap gap-2 mt-6">
        <button type="button" id="fdDeleteBtn" class="btn btn-error btn-sm gap-1 mr-auto hidden" onclick="confirmDelete('deleteFdForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('addFdModal')">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm gap-1">
          <span class="material-symbols-outlined text-base">save</span>Save
        </button>
      </div>
    </form>
    <form id="deleteFdForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
