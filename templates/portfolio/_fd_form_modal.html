<dialog class="modal modal-bottom sm:modal-middle" id="addFdModal">
  <div class="modal-box max-w-lg max-h-[90dvh] overflow-y-auto overscroll-contain">
    <div class="v-modal-header flex items-center justify-between gap-3 pb-3 mb-4 border-b border-[var(--v-hairline)]">
      <h3 id="fdModalTitle" class="font-semibold text-base text-base-content flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-xl">lock</span> Add Fixed Deposit
      </h3>
      <button type="button" class="v-icon-btn" onclick="closeModal('addFdModal')" aria-label="Close">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
    <form id="fdForm" method="post" action="{% url 'add_fd' %}">{% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      {% if is_baby %}<input type="hidden" name="is_baby" value="True">{% endif %}
      <div class="v-form-grid">
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Deposit Name / Bank</span>
            {{ form_obj.name }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Account Holder</span>
            {{ form_obj.account_name }}
          </label>
        </div>
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Principal (₹)</span>
            {{ form_obj.principal }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Interest Rate (%)</span>
            {{ form_obj.interest_rate }}
          </label>
        </div>
        <label class="form-field v-field">
          <span class="v-label">Compounding Frequency</span>
          {{ form_obj.compounding }}
        </label>
        <div class="v-form-grid-2">
          <label class="form-field v-field">
            <span class="v-label">Start Date</span>
            {{ form_obj.start_date }}
          </label>
          <label class="form-field v-field">
            <span class="v-label">Maturity Date</span>
            {{ form_obj.maturity_date }}
          </label>
        </div>
        <label class="form-field flex flex-row items-center gap-3 py-1 cursor-pointer">
          {{ form_obj.is_active }}
          <span class="text-xs font-medium text-base-content/80">Active deposit (accruing interest)</span>
        </label>
        <label class="form-field v-field">
          <span class="v-label">Remarks <span class="text-base-content/40 font-normal normal-case tracking-normal">optional</span></span>
          {{ form_obj.remarks }}
        </label>
      </div>
      <div class="v-modal-footer modal-action flex-wrap items-center gap-2 mt-6 pt-3 border-t border-[var(--v-hairline)]">
        <button type="button" id="fdDeleteBtn" class="v-btn v-btn-danger mr-auto hidden" onclick="confirmDelete('deleteFdForm')">
          <span class="material-symbols-outlined text-base">delete</span>Delete
        </button>
        <button type="button" class="v-btn v-btn-ghost" onclick="closeModal('addFdModal')">Cancel</button>
        <button type="submit" class="v-btn v-btn-primary">
          <span class="material-symbols-outlined text-base">save</span>Save Deposit
        </button>
      </div>
    </form>
    <form id="deleteFdForm" method="post" action="" class="hidden">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close modal">close</button></form>
</dialog>
