{% with w=pct|floatformat:0 %}<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="table-layout:fixed; width:100%; border-collapse:separate; border-radius:4px; overflow:hidden; mso-table-lspace:0pt; mso-table-rspace:0pt;"><tr>{% if w != "0" %}<td width="{{ w }}%" bgcolor="{{ color }}" style="height:{{ height|default:6 }}px; font-size:0; line-height:0; background-color:{{ color }}; border-radius:{% if pct >= 100 %}4px{% else %}4px 0 0 4px{% endif %};">&nbsp;</td>{% endif %}{% if pct < 100 %}<td class="em-track" bgcolor="#e2e8f0" style="height:{{ height|default:6 }}px; font-size:0; line-height:0; background-color:#e2e8f0; border-radius:{% if w == "0" %}4px{% else %}0 4px 4px 0{% endif %};">&nbsp;</td>{% endif %}</tr></table>{% endwith %}
